<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Gap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Letters between Earth and Mars across one turn of their orbits. An interactive piece by Abhiram Nimmala.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
<style>
/* Layout: the gap itself runs across the top as a corridor of light-minutes; letters sit below at reading width; a mission log keeps true orbital state at the side. One deliberate dark world: night ink, Martian dust for Ava, Earth's pale blue for you. */
:root{
  --void:#08090f; --field:#0e1018; --rule:#232737; --ink:#ece6da; --dim:#8f93a4; --faint:#5c6072;
  --dust:#dc9c60; --earth:#a3c6ea; --gold:#ecc679; --sunset:#79a3dc;
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --s-1:.78rem; --s0:1rem; --s1:1.16rem; --s2:1.5rem; --s3:2.3rem; --s4:clamp(3rem,9vw,6.2rem);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--serif);font-size:16px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--earth);outline-offset:3px}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);position:relative}

/* telemetry strip */
.tele{display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
.tele .brand{font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:0;font-size:17px;color:var(--ink);margin-right:6px}
.tele .act{color:var(--ink)}
.tele .sp{flex:1}
.tele b{font-weight:500;color:var(--ink)}
.link::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px;background:#6fcf97}
.link.down::before{background:var(--dust);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.tbtn{background:none;border:1px solid var(--rule);border-radius:999px;padding:5px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);cursor:pointer}
.tbtn:hover{color:var(--ink);border-color:var(--faint)}

/* the corridor */
.corridor{position:relative;border-bottom:1px solid var(--rule);background:radial-gradient(120% 140% at 50% 120%,#121522 0,var(--void) 70%)}
#cor{display:block;width:100%;height:clamp(130px,25vh,230px)}

/* body */
.body{display:grid;grid-template-columns:minmax(0,1fr) 260px;min-height:0}
.letters{display:grid;grid-template-rows:minmax(0,1fr) auto auto;min-height:0;border-right:1px solid var(--rule)}
.feed{overflow-y:auto;padding-block:26px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.feed-in{max-width:36rem;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
.it{animation:in .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.it p{margin:0}
.st{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:6px!important}
.ava .st{color:var(--dust)}
.ava .tx{font-size:var(--s1);line-height:1.55;max-width:34rem;text-wrap:pretty}
.you{align-self:flex-end;text-align:right;max-width:28rem}
.you .tx{font-style:italic;color:var(--earth);font-size:var(--s1);line-height:1.5}
.you .st{margin:6px 0 0!important;color:var(--faint)}
.narr p{font-style:italic;color:var(--dim);font-size:var(--s0);line-height:1.55;max-width:32rem}
.sys p{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);line-height:1.6}
.sys.gold p{color:var(--gold)}
.burst{border-left:1px solid var(--rule);padding-left:16px;display:flex;flex-direction:column;gap:20px}

.status{min-height:22px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px),calc((100% - 36rem)/2));padding-right:max(16px,env(safe-area-inset-right,0px));font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-top:1px solid var(--rule);font-variant-numeric:tabular-nums}
.status .e{color:var(--earth)} .status .m{color:var(--dust)}
.composer{padding-block:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:72px}
.composer:empty::before{content:"";display:block;height:44px}
.cin{max-width:36rem;margin-inline:auto;display:flex;flex-direction:column;gap:10px}
.prompt{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:baseline;text-align:left;background:var(--field);border:1px solid var(--rule);border-radius:10px;padding:11px 14px;cursor:pointer;font-family:var(--serif);font-size:var(--s0);font-style:italic;color:var(--earth);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--earth);background:#131826}
.opt .k{font-family:var(--mono);font-style:normal;font-size:10.5px;color:var(--faint)}
.row{display:flex;gap:10px}
.field{flex:1;min-width:0;background:var(--field);border:1px solid var(--rule);border-radius:10px;padding:11px 14px;font-family:var(--serif);font-style:italic;font-size:var(--s0);color:var(--earth)}
.field::placeholder{color:var(--faint);font-style:italic}
.field:focus{outline:none;border-color:var(--earth)}
.btn{background:var(--earth);color:var(--void);border:0;border-radius:10px;padding:0 18px;min-height:44px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-weight:500}
.btn:disabled{opacity:.35;cursor:default}
.btn.gold{background:var(--gold)}
.btn.line{background:none;color:var(--dim);border:1px solid var(--rule)}
.btn.line:hover{color:var(--ink)}
.btn.big{min-height:52px;font-size:13px;width:100%}

/* players (song, sunset) */
.player{background:var(--field);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.player canvas{display:block;width:100%;height:auto;aspect-ratio:16/7;max-width:100%}
.lyric{padding:16px 16px 6px;min-height:84px;display:flex;flex-direction:column;gap:6px}
.lyric .ln{font-size:var(--s2);font-style:italic;line-height:1.2;color:var(--faint);transition:color .2s}
.lyric .ln.on{color:var(--ink)}
.lyric .ln .ava-v{color:var(--dust)}
.pins{position:relative;height:30px;margin:6px 16px 12px;border-top:1px solid var(--rule)}
.pins .head{position:absolute;top:-4px;width:2px;height:8px;background:var(--ink);left:0}
.pin{position:absolute;top:6px;transform:translateX(-50%);max-width:46%;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;white-space:nowrap;color:var(--dim);animation:in .4s both}
.pin.ava{color:var(--dust)} .pin.you{color:var(--earth)}
.pin.l{transform:none} .pin.r{transform:translateX(-100%)} .pin.r2{top:19px}
.pins{height:40px}
.pbar{display:flex;gap:10px;padding:0 16px 16px}

/* mission log */
.log{padding:18px 18px 18px 20px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--dim);padding-right:max(18px,env(safe-area-inset-right,0px))}
#orbit{width:100%;max-width:222px;aspect-ratio:1;height:auto}
.log dl{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;margin:0;font-variant-numeric:tabular-nums}
.log dt{text-transform:uppercase;color:var(--faint)}
.log dd{margin:0;color:var(--ink);text-align:right}
.acts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--rule);padding-top:14px}
.acts li{display:flex;gap:10px;color:var(--faint)}
.acts li span:first-child{width:2.2em}
.acts li.on{color:var(--ink)} .acts li.done{color:var(--dim)}
.scale{color:var(--faint);line-height:1.6;border-top:1px solid var(--rule);padding-top:14px}

/* veil: title, act cards, ending */
.veil{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(8,9,15,.94);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;cursor:pointer;animation:fade .7s both;overflow-y:auto}
.veil.title,.veil.end{background:rgba(8,9,15,.965);cursor:default}
@keyframes fade{from{opacity:0}}
.vin{max-width:40rem;width:100%;display:flex;flex-direction:column;gap:16px}
.vin h1{font-size:var(--s4);font-weight:400;font-style:italic;line-height:.95;letter-spacing:-.02em;margin:0}
.vin .lede{font-size:var(--s2);line-height:1.3;color:var(--ink);margin:0;text-wrap:balance;max-width:30ch}
.vin .meta{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0}
.vin .numeral{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--dust);margin:0}
.vin h2{font-size:var(--s3);font-weight:400;font-style:italic;line-height:1.05;margin:0;text-wrap:balance}
.vin .cb{font-size:var(--s1);line-height:1.5;color:var(--ink);margin:0;max-width:34rem}
.vin .date{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0}
.vin .tap{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:12px}
.vin .quiet{font-size:var(--s2);font-style:italic;line-height:1.3;margin:0;text-wrap:balance}
.vin .thesis{font-size:var(--s3);font-style:italic;line-height:1.1;margin:0;text-wrap:balance}
.vin .small{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--dim);line-height:1.7;margin:0}
.vin .small a{color:var(--earth)}
.vin .row{flex-wrap:wrap}
.cc{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.05em}

/* debrief */
.deb{display:flex;flex-direction:column;gap:14px;text-align:left}
.deb label{display:flex;flex-direction:column;gap:6px;font-size:var(--s0)}
.deb .q{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.deb textarea,.deb input[type=text]{background:var(--field);border:1px solid var(--rule);border-radius:8px;color:var(--ink);padding:10px 12px;font-family:var(--serif);font-size:var(--s0)}
.deb textarea{min-height:64px;resize:vertical}
.scale5{display:flex;gap:6px;flex-wrap:wrap}
.scale5 label,.radio label{flex-direction:row;align-items:center;gap:6px;background:var(--field);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{border-radius:8px}
.code{font-family:var(--mono);font-size:11px;word-break:break-all;background:var(--field);border:1px solid var(--rule);border-radius:8px;padding:12px;color:var(--earth);user-select:all}

@media (max-width:820px){
  #cor{height:clamp(104px,17vh,180px)}
  .lyric .ln{font-size:var(--s1)}
  .lyric{min-height:0}
  .body{grid-template-columns:minmax(0,1fr)}
  .log{display:none}
  .letters{border-right:0}
  .tele .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){.it,.veil,.pin{animation:none}}
</style>
</head>
<body>


<div class="app" id="app">
  <header class="tele">
    <span class="brand">The Gap</span>
    <span class="act" id="t-act">&nbsp;</span>
    <span class="sp"></span>
    <span id="t-date">&nbsp;</span>
    <span class="hide-sm">One-way <b id="t-delay">&nbsp;</b></span>
    <span class="link" id="t-link">Link</span>
    <button class="tbtn" id="mute" type="button" aria-pressed="false">Sound on</button>
  </header>
  <div class="corridor"><canvas id="cor" aria-label="The space between Earth and Mars. Each tick is one light-minute. Messages cross it as points of light."></canvas></div>
  <main class="body">
    <section class="letters" aria-label="Correspondence">
      <div class="feed" id="feed"><div class="feed-in" id="feedin" aria-live="polite"></div></div>
      <p class="status" id="status"></p>
      <div class="composer" id="composer"></div>
    </section>
    <aside class="log" aria-label="Mission log">
      <canvas id="orbit" width="444" height="444" aria-label="Positions of the Sun, Earth and Mars on the current date"></canvas>
      <dl>
        <dt>Date</dt><dd id="l-date">&nbsp;</dd>
        <dt>Distance</dt><dd id="l-dist">&nbsp;</dd>
        <dt>One-way</dt><dd id="l-delay">&nbsp;</dd>
        <dt>Round trip</dt><dd id="l-rt">&nbsp;</dd>
      </dl>
      <ol class="acts" id="acts">
        <li><span>I</span><span>Close</span></li>
        <li><span>II</span><span>Drift</span></li>
        <li><span>III</span><span>Behind the Sun</span></li>
        <li><span>IV</span><span>Letters</span></li>
        <li><span>V</span><span>Together, later</span></li>
      </ol>
      <p class="scale">Here one second stands for one minute. Distances come from the true orbits of Earth and Mars on each date.</p>
    </aside>
  </main>
  <div class="veil" id="veil" hidden></div>
</div>

<script>
"use strict";
/* ---------------- flags ---------------- */
const Q = new URLSearchParams(location.search);
const HS = location.hash.replace('#','').split(/[,+&]/);
const has = k => Q.has(k) || HS.includes(k);
const SPEED = has('fast') ? 8 : 1;          // testing only
const PLAYTEST = has('playtest');
const KIOSK = has('kiosk');
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- true orbits (J2000 mean elements, Kepler's equation) ---------------- */
const EARTH = [1.00000261, 0.01671123, 102.93768, 100.46457, 0.98560028];
const MARS  = [1.52371034, 0.09339410, -23.94363, -4.55343, 0.52402068];
function kepler(M, e){ let E = M; for (let i = 0; i < 30; i++) E -= (E - e*Math.sin(E) - M) / (1 - e*Math.cos(E)); return E; }
function helio(d, el){
  const [a, e, wd, L0, n] = el, w = wd*Math.PI/180;
  const M = (L0 + n*d)*Math.PI/180 - w, E = kepler(M, e);
  const x = a*(Math.cos(E) - e), y = a*Math.sqrt(1 - e*e)*Math.sin(E);
  return [x*Math.cos(w) - y*Math.sin(w), x*Math.sin(w) + y*Math.cos(w)];
}
function sky(ms){
  const d = (ms - Date.UTC(2000,0,1,12)) / 864e5;
  const e = helio(d, EARTH), m = helio(d, MARS);
  const au = Math.hypot(m[0]-e[0], m[1]-e[1]);
  return { e, m, au, delay: au*499.004784/60 };   // one-way light time, minutes
}
const D = (y, mo, da) => Date.UTC(y, mo-1, da, 12);

/* ---------------- state ---------------- */
const S = { mode:'title', date:D(2035,9,13), sky:null, delay:3.15, link:'ok', sun:0, act:0, flights:[], marks:[] };
let RUN = 0;
class Abort extends Error {}
const vnow = () => performance.now()/1000*SPEED;
function sleep(s){ const tok = RUN; return new Promise((res, rej) => setTimeout(() => tok === RUN ? res() : rej(new Abort()), s*1000/SPEED)); }
function guard(){ const tok = RUN; return () => { if (tok !== RUN) throw new Abort(); }; }

/* ---------------- playtest log ---------------- */
let LOG;
function newLog(){ LOG = { v:1, t0:Date.now(), acts:{}, c:{}, waits:[], blk:{n:0, ch:0}, song:0, react:0, cap:-1, done:0, dur:0 }; }
newLog();
function mark(k){ LOG.acts[k] = Math.round((Date.now() - LOG.t0)/1000); }

/* ---------------- formatting ---------------- */
function fmtMin(m){ const t = Math.max(0, Math.round(m*60)), mm = Math.floor(t/60), ss = t%60; return mm ? `${mm} min ${ss} s` : `${ss} s`; }
function fmtLeft(m){ const r = Math.max(0, m); return r >= 1 ? `${Math.ceil(r)} min` : `${Math.ceil(r*60)} s`; }
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fmtDate(ms){ const d = new Date(ms); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()].slice(0,3)} ${d.getUTCFullYear()}`; }
function fmtLong(ms){ const d = new Date(ms); return `${DAYS[d.getUTCDay()]} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`; }
const kmM = m => Math.round(m*60*299792.458/1e6);

function setDate(ms){ S.date = ms; S.sky = sky(ms); S.delay = S.sky.delay; tele(); }
function tele(){
  $('#t-date').textContent = fmtDate(S.date);
  $('#t-delay').textContent = fmtMin(S.delay);
  $('#l-date').textContent = fmtDate(S.date);
  $('#l-dist').textContent = kmM(S.delay) + ' million km';
  $('#l-delay').textContent = fmtMin(S.delay);
  $('#l-rt').textContent = fmtMin(S.delay*2);
  const L = $('#t-link'); L.classList.toggle('down', S.link === 'down'); L.textContent = S.link === 'down' ? 'Link down' : 'Link';
}
const ACTNAMES = ['', 'I · Close', 'II · Drift', 'III · Behind the Sun', 'IV · Letters', 'V · Together, later'];
function setAct(n){
  S.act = n; $('#t-act').textContent = ACTNAMES[n] || ' ';
  [...$('#acts').children].forEach((li, i) => { li.classList.toggle('on', i+1 === n); li.classList.toggle('done', i+1 < n); });
  if (n) mark('a' + n);
}

/* ---------------- sound (Web Audio, nothing loaded) ---------------- */
let AC = null, MASTER = null, DRONE = null, HISS = null, muted = false;
function audio(){
  if (AC) return AC;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); MASTER = AC.createGain(); MASTER.gain.value = muted ? 0 : 0.9; MASTER.connect(AC.destination); } catch(e){ AC = null; }
  return AC;
}
function tone(f, at, dur, o = {}){
  if (!AC) return;
  const t = AC.currentTime + (at || 0), g = AC.createGain(), osc = AC.createOscillator();
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
  if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
  const v = o.vol ?? 0.06, a = o.attack ?? 0.012;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(o.dest || MASTER); osc.start(t); osc.stop(t + dur + 0.05);
}
const SFX = {
  send(){ tone(520, 0, .35, {slide:860, vol:.045}); },
  landM(){ tone(392, 0, .5, {type:'triangle', vol:.025}); },
  ava(){ tone(220, 0, 1.1, {type:'triangle', vol:.05}); tone(330, .14, 1.2, {type:'triangle', vol:.04}); },
  card(){ tone(110, 0, 2.4, {vol:.05, attack:.4}); tone(164.8, .1, 2.4, {vol:.03, attack:.5}); },
};
function startDrone(){
  if (!AC || DRONE) return;
  const g = AC.createGain(); g.gain.value = 0; g.connect(MASTER);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.connect(g);
  [55, 82.4, 110.3].forEach((f, i) => { const o = AC.createOscillator(); o.type = i === 2 ? 'triangle' : 'sine'; o.frequency.value = f; o.detune.value = (i - 1)*4; const og = AC.createGain(); og.gain.value = i === 2 ? .25 : .5; o.connect(og); og.connect(lp); o.start(); });
  const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = .05; lg.gain.value = 160; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  g.gain.linearRampToValueAtTime(.035, AC.currentTime + 4);
  DRONE = g;
  const buf = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = Math.random()*2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = .6;
  const hg = AC.createGain(); hg.gain.value = 0; src.connect(bp); bp.connect(hg); hg.connect(MASTER); src.start();
  HISS = hg;
}
function solarNoise(on){
  if (!AC || !DRONE) return; const t = AC.currentTime;
  HISS.gain.cancelScheduledValues(t); HISS.gain.linearRampToValueAtTime(on ? .03 : 0, t + 3);
  DRONE.gain.cancelScheduledValues(t); DRONE.gain.linearRampToValueAtTime(on ? .012 : .035, t + 3);
}
$('#mute').addEventListener('click', () => {
  muted = !muted; $('#mute').textContent = muted ? 'Sound off' : 'Sound on'; $('#mute').setAttribute('aria-pressed', muted);
  if (MASTER) MASTER.gain.setTargetAtTime(muted ? 0 : .9, AC.currentTime, .1);
});

/* Happy Birthday to You (public domain). MIDI note, beats. */
const SONG = [[67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2],
              [67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],
              [67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,2],
              [77,.75],[77,.25],[76,1],[72,1],[74,1],[72,2.5]];
const PHRASES = ['Happy birthday to you', 'Happy birthday to you', 'Happy birthday, dear Grandma', 'Happy birthday to you'];
const PHRASE_AT = [0, 6, 12, 19];   // beat where each phrase starts
const BEAT = .42;
const SONG_BEATS = SONG.reduce((s, n) => s + n[1], 0);
const songSecs = () => SONG_BEATS*BEAT;   // story seconds; audio divides by SPEED itself
const mf = n => 440*Math.pow(2, (n - 69)/12);
function playSong(withAva){
  if (!AC) return;
  let b = 0;
  for (const [n, len] of SONG){
    const t = b*BEAT/SPEED, d = Math.max(.12, len*BEAT/SPEED*.95);
    tone(mf(n), t, d, {type:'triangle', vol:.05});
    tone(mf(n)*1.004, t + .015, d, {type:'triangle', vol:.03});
    tone(mf(n - 12), t + .03, d, {type:'sine', vol:.02});
    if (withAva && b >= PHRASE_AT[2]) tone(mf(n - 12), t, d*1.05, {type:'sine', vol:.085, attack:.04});
    b += len;
  }
}

/* ---------------- flights across the gap ---------------- */
/* from: 'earth'|'mars'. kind: 'msg'|'song'. dur: seconds here (= minutes there). len: stream length in seconds. */
function launch(from, kind = 'msg', o = {}){
  let f; const done = new Promise(r => {
    f = { from, kind, dur: o.dur ?? S.delay, len: o.len || 0, t0: o.t0 ?? vnow(), arrive: r, held: !!o.held, slot: o.slot || 0, head: false, onHead: o.onHead };
  });
  S.flights.push(f); return { f, done };
}
function release(f, at){ f.held = false; f.t0 = at ?? vnow(); f.dur = S.delay; }

/* ---------------- the letters ---------------- */
const feedin = $('#feedin'), feed = $('#feed'), comp = $('#composer'), status = $('#status');
function item(cls, html, parent){
  const el = document.createElement('div'); el.className = 'it ' + cls; el.innerHTML = html;
  (parent || feedin).appendChild(el);
  requestAnimationFrame(() => feed.scrollTo({ top: feed.scrollHeight, behavior: REDUCE ? 'auto' : 'smooth' }));
  return el;
}
const narr = t => item('narr', `<p>${t}</p>`);
const sys = (t, gold) => item('sys' + (gold ? ' gold' : ''), `<p>${t}</p>`);
function letter(text, stamp, parent){ item('ava', `<p class="st">${stamp}</p><p class="tx">${text}</p>`, parent); SFX.ava(); }
const readTime = t => Math.min(9, Math.max(2.4, t.replace(/<[^>]+>/g,'').length/21));
const read = t => sleep(readTime(t));

/* Ava writes. lead: how long ago she sent it, in minutes, so it can already be in flight. */
async function ava(text, o = {}){
  const g = guard();
  if (o.compose) await sleep(o.compose);
  const dur = S.delay, lead = o.lead || 0;
  const L = launch('mars', 'msg', { dur, t0: vnow() - Math.min(lead, dur - .5) });
  await L.done; g();
  letter(text, o.stamp || `Ava · Jezero · sent ${fmtMin(dur)} ago`);
  if (!o.noRead) await read(text);
}
/* You write. Returns the flight so the script can wait for arrival. */
function you(text, o = {}){
  const el = item('you', `<p class="tx">${text === null ? '<span style="opacity:.7">(a light, with no words)</span>' : esc(text)}</p><p class="st">You · <span class="lv"></span></p>`);
  const lv = el.querySelector('.lv');
  const L = launch('earth', 'msg', { held: o.held, slot: o.slot });
  L.f.label = lv;
  L.done.then(() => { lv.textContent = 'arrived on Mars'; SFX.landM(); });
  SFX.send();
  return L;
}

/* ---------------- composer controls ---------------- */
function waitLog(key, t0){ LOG.waits.push([key, Math.round(performance.now()/100 - t0/100)/10]); }
function choose(key, opts, prompt = 'Write back'){
  return new Promise(res => {
    const t0 = performance.now();
    comp.innerHTML = `<div class="cin"><p class="prompt">${prompt}</p><div class="opts">${opts.map((o, i) => `<button class="opt" type="button" data-i="${i}"><span class="k">${i+1}</span><span>${o}</span></button>`).join('')}</div></div>`;
    const pick = i => { document.removeEventListener('keydown', kd); comp.innerHTML = ''; LOG.c[key] = i; waitLog(key, t0); res(i); };
    const kd = e => { const n = +e.key; if (n >= 1 && n <= opts.length && document.activeElement?.tagName !== 'INPUT') pick(n - 1); };
    document.addEventListener('keydown', kd);
    comp.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => pick(+b.dataset.i)));
    comp.querySelector('.opt').focus({ preventScroll: true });
  });
}
function action(key, label, cls = ''){
  return new Promise(res => {
    const t0 = performance.now();
    comp.innerHTML = `<div class="cin"><button class="btn big ${cls}" type="button" id="act-btn">${label}</button></div>`;
    const b = $('#act-btn'); b.focus({ preventScroll: true });
    b.addEventListener('click', () => { comp.innerHTML = ''; waitLog(key, t0); res(); }, { once: true });
  });
}
function compose(placeholder, onSend, extra = ''){
  comp.innerHTML = `<div class="cin"><form class="row" id="wform" autocomplete="off"><input class="field" id="wfield" maxlength="280" placeholder="${placeholder}" aria-label="${placeholder}"><button class="btn" id="wsend" type="submit" disabled>Send</button></form>${extra}</div>`;
  const f = $('#wfield'), s = $('#wsend');
  f.addEventListener('input', () => { s.disabled = !f.value.trim(); });
  $('#wform').addEventListener('submit', e => { e.preventDefault(); const v = f.value.trim(); if (!v) return; f.value = ''; s.disabled = true; onSend(v); });
  setTimeout(() => f.focus({ preventScroll: true }), 50);
  return f;
}

/* ---------------- cards ---------------- */
function veilShow(cls, html){ const v = $('#veil'); v.className = 'veil ' + cls; v.innerHTML = html; v.hidden = false; return v; }
function card(html, hold = 5){
  const tok = RUN; SFX.card();
  return new Promise((res, rej) => {
    const v = veilShow('card', `<div class="vin">${html}<p class="tap">Tap to continue</p></div>`);
    let done = false;
    const fin = () => { if (done) return; done = true; v.hidden = true; v.onclick = null; document.removeEventListener('keydown', kd); tok === RUN ? res() : rej(new Abort()); };
    const kd = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fin(); } };
    v.onclick = fin; document.addEventListener('keydown', kd);
    setTimeout(fin, hold*1000/SPEED);
  });
}
function actCard(n, title, ms, line){
  return card(`<p class="numeral">${['','I','II','III','IV','V'][n]}</p><h2>${title}</h2><p class="date">${fmtLong(ms)}</p><p class="cb">${line}</p>`, 6);
}
async function timelapse(d1, secs){
  const g = guard(), d0 = S.date, t0 = vnow(), T = secs;
  while (true){ const p = Math.min(1, (vnow() - t0)/T); setDate(d0 + (d1 - d0)*(.5 - .5*Math.cos(Math.PI*p))); if (p >= 1) break; await new Promise(r => requestAnimationFrame(r)); g(); }
}
async function tween(key, to, secs){ const g = guard(), a = S[key], t0 = vnow(); while (true){ const p = Math.min(1, (vnow() - t0)/secs); S[key] = a + (to - a)*p; if (p >= 1) break; await new Promise(r => requestAnimationFrame(r)); g(); } }

/* =================================================================
   THE SCRIPT
   ================================================================= */
async function story(){
  const g = guard();
  newLog(); S.mode = 'story'; S.flights = []; feedin.innerHTML = ''; comp.innerHTML = '';
  setDate(D(2035,9,13)); S.link = 'ok'; S.sun = 0; tele(); setAct(0);

  await card(`<p class="cb">Your sister Ava has lived on Mars for eleven months. She runs the greenhouse at Jezero Station.</p>`, 5);
  await card(`<p class="cb">Anything you send her travels at the speed of light. Nothing goes faster, and nothing ever will.</p><p class="cb" style="color:var(--dim)">Here, one second stands for one minute.</p>`, 6);

  /* ---------- I · CLOSE ---------- */
  setAct(1);
  await actCard(1, 'Close', S.date, `Mars is as near as it gets this decade. A message takes ${fmtMin(S.delay)} to reach her.`);
  await ava(`First tomato. It's the size of a marble, and the crew has to vote before anyone eats it. Everything up here needs a committee. Except you, this week. Three minutes! Talk to me.`, { lead: S.delay - 1.2 });
  const c1 = await choose('c1', ['Eat it before the vote. I won’t tell.', 'Send me a picture.', 'Three minutes is basically next door.']);
  let L = you(['Eat it before the vote. I won’t tell.', 'Send me a picture.', 'Three minutes is basically next door.'][c1]);
  await L.done; g();
  await ava([
    `Too late. Teo is guarding it like it's the last tomato in the solar system. Which, to be fair, it is.`,
    `Uploading. It'll take an hour, because pictures queue behind the science data. Picture a red marble. Now picture me holding it like a newborn.`,
    `Basically next door. I can almost hear you thinking between messages. I've missed this.`][c1], { compose: 1.4 });
  await ava(`Is Grandma still planning the big ninety in March? Tell her to ship me a slice. Insulated.`, { compose: 1.2 });
  const c2 = await choose('c2', ['March 29. She’s already practicing the candles.', 'She asks about you every single day.']);
  L = you(['March 29. She’s already practicing the candles.', 'She asks about you every single day.'][c2]);
  await sleep(.6);
  const A3 = ava(`Also: I can see Earth tonight, low over the crater rim. Grandma's trick works backwards from here. Find the blue one that doesn't twinkle.`, { compose: 0, noRead: true });
  await L.done; g(); await A3; g(); await read('x'.repeat(130));
  await ava([
    `Practicing. Of course she is. Ninety and still competitive.`,
    `Every day. Tell her I look up every night, and that isn't even a metaphor. Looking up is literally my job.`][c2], { compose: 1.2 });
  await ava(`Something I have to tell you. The station wants an answer before the conjunction next September: sign on for another tour, or fly home when the window opens. I don't know yet. Don't answer now. We have time.`, { compose: 2 });
  await ava(`Do we?`, { compose: 1.6 });
  await ava(`Signal's strong tonight. Goodnight from next door.`, { compose: 2.2 });
  await sleep(2);

  /* ---------- months pass ---------- */
  narr(`Earth pulls ahead in its orbit. Every week, the letters take a little longer.`);
  await timelapse(D(2036,3,29), 7);

  /* ---------- II · DRIFT ---------- */
  setAct(2);
  await actCard(2, 'Drift', S.date, `Grandma turns ninety today. A message now takes ${fmtMin(S.delay)}.`);
  narr(`The whole family is crammed into Grandma's kitchen. Someone lights ninety candles, or close enough.`);
  await sleep(2.5);
  await action('song', '♪ Send the song to Ava as you sing it', 'gold');
  LOG.song = 1;
  const songLen = songSecs();
  const songEl = item('sys gold', `<p>♪ The family sings · streaming to Mars</p>`);
  playSong(false);
  const song = launch('earth', 'song', { len: songLen, onHead: () => sys(`The first note reaches Mars ${fmtMin(S.delay)} after you sang it.`) });
  let lyricBox = item('narr', `<p class="lyr"></p>`); const lyr = lyricBox.querySelector('.lyr');
  const lyricRun = (async () => { for (let i = 0; i < 4; i++){ lyr.textContent = '♪ ' + PHRASES[i] + ' ♪'; const nb = i < 3 ? PHRASE_AT[i+1] - PHRASE_AT[i] : SONG_BEATS - PHRASE_AT[3]; await sleep(nb*BEAT); } lyr.textContent = 'The candles go out. Everyone cheers.'; })();
  await sleep(1.5);
  const early = ava(`Is it the party yet? I've lost track of your time. Tell Grandma I'm singing from here. Starting now.`, { lead: S.delay - 3, noRead: true });
  await lyricRun; g(); await early; g();
  await sleep(1);
  narr(`Her “now” left Mars fifteen minutes ago. She sang before you did, alone, and finished before you started.`);
  await song.done; g();
  await sleep(1);
  sys(`The last note reaches Ava ${fmtMin(S.delay)} after the candles went out.`);
  await ava(`I just heard the song. I tried to sing along, but you'd all finished a quarter of an hour before it got here, so mostly I was singing to the dome. Teo clapped. That was nice of him.`, { compose: 1.5 });
  await ava(`Dust storm on the forecast. If it gets bad they cut power to the greenhouse first.`, { lead: S.delay - 3 });
  const c3 = await choose('c3', ['Are you safe?', 'Protect the tomatoes.']);
  L = you(['Are you safe?', 'Protect the tomatoes.'][c3]);
  const nevermind = ava(`Never mind. The storm turned north. Tomatoes live.`, { lead: S.delay - 6, noRead: true });
  await nevermind; g();
  await sleep(3);
  narr(`Your letter is still crossing, on its way to a storm that has already turned north.`);
  await L.done; g();
  await ava([
    `You asked if I'm safe. I am. I was safe twenty minutes ago too, but you were worrying about a storm that had already left. It's strange, being answered by the past.`,
    `Your tomato rescue mission arrived after the storm had gone. Very brave. Very late. I love you for it.`][c3], { compose: 1.4 });
  narr(`Every answer arrives for someone who has already moved on.`);
  await sleep(2.5);
  await ava(`OK. I need to ask you properly, before the Sun gets between us in September. Should I come home?`, { lead: S.delay - 2.5 });
  const DEC = ['Come home.', 'Stay. You love it there.', 'It’s your call. I’m here either way.'];
  const c4 = await choose('c4', DEC);
  L = you(DEC[c4]);
  await sleep(2);
  narr(`You wait.`);
  await L.done; g();
  await ava(`I read it three times. Give me until September.`, { compose: 2.4 });
  await sleep(2);

  /* ---------- toward conjunction ---------- */
  narr(`Through the summer Earth and Mars swing toward opposite sides of the Sun.`);
  await timelapse(D(2036,9,4), 7);

  /* ---------- III · BEHIND THE SUN ---------- */
  setAct(3);
  await actCard(3, 'Behind the Sun', S.date, `Mars slips behind the Sun. Its glare drowns every signal. For fourteen days, nothing gets through.`);
  await ava(`The Sun's about to get between us. Two weeks of nothing. I'll keep writing anyway. Don't worry if it's quiet.`, { lead: S.delay - 1.5 });
  await sleep(1);
  solarNoise(true);
  await tween('sun', 1, 4);
  S.link = 'down'; tele();
  sys(`Link down · solar conjunction`);
  const held = [];
  compose('Write anyway. It will wait until the Sun moves.', v => {
    LOG.blk.n++; LOG.blk.ch += v.length;
    held.push(you(v, { held: true, slot: held.length }).f);
  });
  const NOTES = { 2:`You start a message out of habit. It waits.`, 5:`Mom sets a place for Ava at dinner by mistake. Nobody moves it.`, 8:`You look for Mars at night. It's lost in the Sun's glare.`, 11:`You notice you've stopped checking your phone.`, 14:`The glare begins to thin.` };
  const dayEl = sys(`Day 1 of 14`);
  const base = S.date;
  for (let day = 1; day <= 14; day++){
    dayEl.querySelector('p').textContent = `Day ${day} of 14 · nothing in, nothing out`;
    setDate(base + (day - 1)*864e5);
    if (NOTES[day]) narr(NOTES[day]);
    await sleep(4);
  }
  const fld = $('#wfield');
  if (fld && fld.value.trim()){ const v = fld.value.trim(); LOG.blk.n++; LOG.blk.ch += v.length; held.push(you(v, { held: true, slot: held.length }).f); }
  comp.innerHTML = '';
  await tween('sun', 0, 3);
  solarNoise(false);
  S.link = 'ok'; setDate(D(2036,9,18));

  /* ---------- IV · LETTERS ---------- */
  setAct(4);
  const relAt = vnow();
  held.forEach((f, i) => release(f, relAt + i*.35));
  const LETTERS = [
    ['Day 1', `I know you can't read this for two weeks, so I won't ask you anything. I'll just tell you about today. The tomato vote passed, six to one. Teo voted no; he says it's too beautiful to eat. We cut it into seven pieces anyway. It tasted like summer on Grandma's porch.`],
    ['Day 4', `Funny thing. When you were fifteen minutes away I spent whole evenings waiting for fifteen minutes to pass. Now there's nothing to wait for, and I've just been here. Phobos crossed the sky twice today. I watched both times.`],
    ['Day 8', `I tried writing to you the way we talk on the phone, and it didn't work. So I'm writing this like a letter you'll open later. Whatever you're doing when you read it: hi. I mean that for that exact moment, whenever it turns out to be.`],
    ['Day 10', `Remember the porch? "Find the red one that doesn't twinkle." I can't see Earth right now; the Sun's in the way. But I know exactly where you are. That turned out to be enough.`],
    ['Day 13', `I signed. Another tour, twenty-six months. I'm not staying away from you. I worked out how to be here and still be with you. From now on I'll write like this: letters that don't need to arrive on time.`],
  ];
  const burst = LETTERS.map((l, i) => launch('mars', 'msg', { t0: relAt + i*.6 }));
  await actCard(4, 'Letters', S.date, `The Sun moves on and the link comes back. Everything both of you wrote in the dark leaves at once. A message takes ${fmtMin(S.delay)}.`);
  sys(held.length ? `Link restored · Ava's letters and your ${held.length} leave at the same moment` : `Link restored · Ava's letters from the silence are on their way`);
  await burst[0].done; g();
  sys(`${LETTERS.length} letters from Ava, written during the silence`);
  const N = held.length;
  const lastArrive = N ? Math.max(...held.map(f => f.t0 + f.dur)) : relAt + S.delay;
  const reply = launch('mars', 'msg', { t0: lastArrive + 2.5 });   // she answers as soon as your letters land
  const bwrap = item('burst', '');
  for (let i = 0; i < LETTERS.length; i++){
    await burst[i].done; g();
    letter(LETTERS[i][1], `Ava · written on day ${LETTERS[i][0].split(' ')[1]} of the silence`, bwrap);
    await read(LETTERS[i][1]);
  }
  const open = N
    ? `Your ${N === 1 ? 'letter' : N + ' letters'} from the silence came in one breath. I read ${N === 1 ? 'it' : 'them in order, like a book'}.`
    : `You didn't write during the silence. That's all right. I wrote enough for both of us.`;
  const close = [
    `And I know you said come home. I read it a hundred times in the dark. I will come home. Just not until the next window. Wait for me the way I learned to wait for you.`,
    `You said stay. You were right before I was. It's a strange feeling, being right together, five months apart.`,
    `You said you're here either way. That sentence crossed fifteen minutes of space and five months of me not knowing, and it was still true when it landed.`][c4];
  await reply.done; g();
  letter(`${open} ${close}`, `Ava · Jezero · sent ${fmtMin(reply.f.dur)} ago`);
  await read(open + close);
  await sleep(2);

  /* ---------- V · TOGETHER, LATER ---------- */
  await timelapse(D(2036,10,11), 3);
  setAct(5);
  await actCard(5, 'Together, later', S.date, `A message takes ${fmtMin(S.delay)}. That is never going to change, so she stopped trying to beat it.`);
  await ava(`I made you something. I watched the video of Grandma's party with everyone's reactions pinned to the song, and I added mine. Press play. I'm on the beat this time.`, { lead: S.delay - 1.4 });
  await songPlayer(); g();
  sys(`Ava sang this on Mars, six months after the party. Late by half a year. Exactly on the beat.`, true);
  await sleep(3.5);
  await ava(`Your turn. This is tonight's sunset at Jezero. On Mars the sunsets are blue. Watch it with me, and tap whenever you want to leave a reaction. I'll see each one at the exact second you left it.`, { lead: S.delay - 2 });
  await sunsetPlayer(); g();
  await sleep(1.5);
  narr(`One last thing. Write Ava a letter that doesn't need an answer.`);
  const cap = await new Promise(res => {
    const t0 = performance.now();
    compose('Write to her…', v => { waitLog('cap', t0); comp.innerHTML = ''; res(v); }, `<button class="btn line" type="button" id="nolight">Send just a light, no words</button>`);
    $('#nolight').addEventListener('click', () => { waitLog('cap', t0); comp.innerHTML = ''; res(null); });
  });
  LOG.cap = cap === null ? 0 : cap.length;
  you(cap);
  await sleep(4);
  await ending();
}

/* ---------- Act V players ---------- */
function songPlayer(){
  return new Promise(res => {
    const t0p = performance.now();
    const pins = [[.4, 'Mom: we started too high', ''], [2.6, 'Grandma laughs', ''], [PHRASE_AT[2]*BEAT, 'Ava joins', 'ava'], [9.3, 'Teo, on Mars: bravo', 'ava']];
    comp.innerHTML = `<div class="cin"><div class="player"><div class="lyric" id="lyr">${PHRASES.map(p => `<div class="ln">${p}</div>`).join('')}</div><div class="pins" id="pins"><div class="head" id="phead"></div></div><div class="pbar"><button class="btn gold" type="button" id="pplay">▶ Play</button><span class="cc" id="pcc">Family in Grandma's kitchen · Ava on Mars, added later</span></div></div></div>`;
    const play = $('#pplay'); play.focus({ preventScroll: true });
    play.addEventListener('click', async () => {
      waitLog('songplay', t0p);
      play.disabled = true; playSong(true);
      const T = songSecs(), start = vnow(), lns = [...$('#lyr').children], shown = new Set();
      while (true){
        const el = vnow() - start, p = Math.min(1, el/T), beat = el/BEAT;
        $('#phead').style.left = (p*100) + '%';
        lns.forEach((ln, i) => { const on = beat >= PHRASE_AT[i] && (i === 3 || beat < PHRASE_AT[i+1]); ln.classList.toggle('on', on); if (i >= 2 && on && !ln.dataset.a){ ln.dataset.a = 1; ln.innerHTML = ln.textContent + ' <span class="ava-v">· with Ava</span>'; } });
        pins.forEach((pn, i) => { if (!shown.has(i) && el >= pn[0]){ shown.add(i); const d = document.createElement('span'); d.className = 'pin ' + pn[2]; placePin(d, pn[0]/T*100, i%2); d.textContent = pn[1]; $('#pins').appendChild(d); } });
        if (p >= 1) break;
        await new Promise(r => requestAnimationFrame(r));
      }
      await sleep(1.2); comp.innerHTML = ''; res();
    }, { once: true });
  });
}
function sunsetPlayer(){
  return new Promise(res => {
    const t0p = performance.now();
    comp.innerHTML = `<div class="cin"><div class="player"><canvas id="sun" width="960" height="420" aria-label="A blue sunset over the rim of Jezero crater"></canvas><div class="pins" id="spins"><div class="head" id="shead"></div></div><div class="pbar"><button class="btn gold" type="button" id="splay">▶ Watch with her</button><button class="btn line" type="button" id="sreact" disabled>Leave a reaction here</button></div></div></div>`;
    const cv = $('#sun'), x = cv.getContext('2d'); drawSunset(x, cv, 0);
    $('#splay').focus({ preventScroll: true });
    $('#splay').addEventListener('click', async () => {
      waitLog('sunset', t0p);
      $('#splay').disabled = true; const r = $('#sreact'); r.disabled = false;
      if (AC){ [196, 246.9, 293.7, 392].forEach((f, i) => tone(f, i*.5/SPEED, 13/SPEED, { vol:.022, attack:2/SPEED })); }
      const T = 14, start = vnow();
      const avaPins = [[3.2, 'Ava: here it goes'], [8.6, 'Ava: the blue part']];
      const shown = new Set(); let n = 0;
      r.addEventListener('click', () => {
        const el = Math.min(T, vnow() - start); n++; LOG.react = n;
        const d = document.createElement('span'); d.className = 'pin you'; placePin(d, el/T*100, 1 - n%2); d.textContent = 'you · ' + fmtClock(el); $('#spins').appendChild(d);
        tone(660, 0, .4, { vol:.03 });
      });
      while (true){
        const el = vnow() - start, p = Math.min(1, el/T);
        drawSunset(x, cv, p); $('#shead').style.left = (p*100) + '%';
        avaPins.forEach((pn, i) => { if (!shown.has(i) && el >= pn[0]){ shown.add(i); const d = document.createElement('span'); d.className = 'pin ava'; placePin(d, pn[0]/T*100, 0); d.textContent = pn[1]; $('#spins').appendChild(d); } });
        if (p >= 1) break;
        await new Promise(rr => requestAnimationFrame(rr));
      }
      r.disabled = true;
      await sleep(1);
      comp.innerHTML = '';
      sys(n ? `Your ${n === 1 ? 'reaction is' : n + ' reactions are'} pinned to her sunset. She'll feel ${n === 1 ? 'it' : 'each one'} at the second you left ${n === 1 ? 'it' : 'them'}, whenever she watches.` : `You watched it with her. She'll see that you did.`);
      res();
    }, { once: true });
  });
}
function placePin(d, pct, row){ d.style.left = pct + '%'; if (pct < 22) d.classList.add('l'); else if (pct > 78) d.classList.add('r'); if (row) d.classList.add('r2'); }
const fmtClock = s => '0:' + String(Math.floor(s)).padStart(2, '0');
function drawSunset(x, cv, p){
  const W = cv.width, H = cv.height;
  // Martian sky: butterscotch by day, a cold blue halo around the setting Sun
  const g = x.createLinearGradient(0, 0, 0, H);
  const day = 1 - p;
  g.addColorStop(0, `rgb(${Math.round(40 + 120*day)},${Math.round(34 + 80*day)},${Math.round(40 + 40*day)})`);
  g.addColorStop(.7, `rgb(${Math.round(70 + 130*day)},${Math.round(52 + 90*day)},${Math.round(44 + 30*day)})`);
  g.addColorStop(1, `rgb(${Math.round(60 + 110*day)},${Math.round(44 + 70*day)},${Math.round(36 + 20*day)})`);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const sx = W*.56, sy = H*(.34 + .5*p);
  const halo = x.createRadialGradient(sx, sy, 0, sx, sy, W*.32);
  const b = Math.min(1, p*1.6);
  halo.addColorStop(0, `rgba(205,225,255,${.9})`);
  halo.addColorStop(.08, `rgba(140,180,235,${.25 + .55*b})`);
  halo.addColorStop(.4, `rgba(90,130,200,${.12*b + .02})`);
  halo.addColorStop(1, 'rgba(90,130,200,0)');
  x.fillStyle = halo; x.fillRect(0, 0, W, H);
  x.fillStyle = '#f2f4ff'; x.beginPath(); x.arc(sx, sy, W*.012, 0, 7); x.fill();
  // crater rim
  x.fillStyle = `rgb(${Math.round(30 + 40*day)},${Math.round(20 + 22*day)},${Math.round(18 + 12*day)})`;
  x.beginPath(); x.moveTo(0, H);
  for (let i = 0; i <= 60; i++){ const u = i/60; x.lineTo(u*W, H*(.78 - .05*Math.sin(u*5.1 + 1) - .025*Math.sin(u*17) - .06*Math.exp(-(((u - .2)/.08)**2)))); }
  x.lineTo(W, H); x.closePath(); x.fill();
  // Earth, a blue point that doesn't twinkle, once the sky darkens
  if (p > .6){ x.fillStyle = `rgba(170,205,245,${(p - .6)*2.4})`; x.beginPath(); x.arc(W*.28, H*.2, 2.6, 0, 7); x.fill(); }
}

/* ---------- ending ---------- */
async function ending(){
  const tok = RUN; S.mode = 'end'; LOG.done = 1; LOG.dur = Math.round((Date.now() - LOG.t0)/1000); mark('end');
  const lines = [`It will reach her in ${fmtMin(S.delay)}.`, `You won't be there when she reads it.`, `You'll still be in it.`];
  for (const l of lines){ await card(`<p class="quiet">${l}</p>`, 3.6); if (tok !== RUN) return; }
  if (PLAYTEST && !LOG.asked){ LOG.asked = 1; debrief(); return; }   // ask before the thesis is ever stated
  showEnd();
}
function showEnd(){
  const paper = KIOSK ? '' : ` · <a href="https://doi.org/10.5281/zenodo.23447365" target="_blank" rel="noopener">Read the paper</a>`;
  veilShow('end', `<div class="vin">
    <p class="thesis">Connected is not the same as together. Across the gap, together has to be designed.</p>
    <p class="small">Next closest approach: November 2037. Ava will be four minutes away.</p>
    <p class="small">The Gap · Abhiram Nimmala · from “Latency-Native Media: Designing Shared Experience for an Interplanetary Civilization” (2026)${paper}</p>
    <div class="row"><button class="btn line" type="button" id="again">Begin again</button></div>
  </div>`);
  $('#again').addEventListener('click', toTitle);
}

/* ---------- playtest debrief ---------- */
const MOMENTS = ['The song reaching Ava after the candles were out', 'Answering a storm that had already passed', 'The fourteen days of silence', 'Ava’s letters from the silence', 'Ava singing on the beat, months later', 'Watching the blue sunset with her', 'Writing the last letter', 'None of them'];
function debrief(){
  const r5 = name => `<div class="scale5">${[1,2,3,4,5].map(n => `<label><input type="radio" name="${name}" value="${n}" id="${name}${n}">${n}</label>`).join('')}</div>`;
  veilShow('end', `<div class="vin"><form class="deb" id="debf">
    <p class="numeral">Playtest · four questions</p>
    <label><span class="q">Your initials</span><input type="text" id="d-who" maxlength="6"></label>
    <label><span class="q">1 · In one sentence, what was this piece about?</span><textarea id="d-about"></textarea></label>
    <label><span class="q">2 · Name one thing about Ava's life.</span><input type="text" id="d-ava" maxlength="160"></label>
    <div><p class="q">3 · Which moment hit hardest?</p><div class="radio">${MOMENTS.map((m, i) => `<label><input type="radio" name="d-mom" value="${i}" id="d-mom${i}">${m}</label>`).join('')}</div></div>
    <div><p class="q">4a · I cared what happened to Ava (1 = not at all, 5 = a lot)</p>${r5('d-care')}</div>
    <div><p class="q">4b · I understood why the delay changes how people talk (1–5)</p>${r5('d-und')}</div>
    <label><span class="q">Was there a moment you didn't know what to do? Where?</span><input type="text" id="d-lost" maxlength="160" placeholder="Leave blank if not"></label>
    <button class="btn" type="submit">Show my code</button>
  </form></div>`);
  $('#debf').addEventListener('submit', e => {
    e.preventDefault();
    const val = n => (document.querySelector(`input[name="${n}"]:checked`) || {}).value;
    const out = { ...LOG, who: $('#d-who').value.trim(), about: $('#d-about').value.trim(), avaq: $('#d-ava').value.trim(), mom: val('d-mom') ?? null, care: +(val('d-care') || 0), und: +(val('d-und') || 0), lost: $('#d-lost').value.trim() };
    const code = 'GAP1.' + btoa(unescape(encodeURIComponent(JSON.stringify(out)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    veilShow('end', `<div class="vin"><p class="numeral">Playtest code</p><p class="cb">Thank you. Hand this code to the person running the test.</p><p class="code" id="codebox">${code}</p><div class="row"><button class="btn" type="button" id="copy">Copy code</button><button class="btn line" type="button" id="again2">See the ending</button></div></div>`);
    $('#copy').addEventListener('click', () => {
      navigator.clipboard.writeText(code).then(() => { $('#copy').textContent = 'Copied'; }, () => { const rg = document.createRange(); rg.selectNodeContents($('#codebox')); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); $('#copy').textContent = 'Selected, press copy'; });
    });
    $('#again2').addEventListener('click', showEnd);
  });
}

/* ---------- title ---------- */
function toTitle(){
  RUN++; S.mode = 'title'; S.flights = []; S.sun = 0; S.link = 'ok'; comp.innerHTML = ''; feedin.innerHTML = ''; setAct(0);
  setDate(D(2035,9,13));
  veilShow('title', `<div class="vin">
    <h1>The Gap</h1>
    <p class="lede">Letters between Earth and Mars, across one turn of their orbits.</p>
    <p class="meta">About 9 minutes · best with sound${PLAYTEST ? ' · playtest' : ''}</p>
    <div class="row"><button class="btn" type="button" id="begin">Begin</button></div>
  </div>`);
  $('#begin').focus({ preventScroll: true });
  $('#begin').addEventListener('click', () => {
    audio(); if (AC && AC.state === 'suspended') AC.resume(); startDrone();
    $('#veil').hidden = true; RUN++;
    story().catch(e => { if (!(e instanceof Abort)) console.error(e); });
  });
}

/* ---------- kiosk: return to the title after two idle minutes ---------- */
let lastInput = performance.now();
['pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, () => { lastInput = performance.now(); }, { passive: true }));
if (KIOSK) setInterval(() => { if (S.mode !== 'title' && performance.now() - lastInput > 120000) toTitle(); }, 5000);

/* =================================================================
   DRAWING
   ================================================================= */
const cor = $('#cor'), cx = cor.getContext('2d'), orb = $('#orbit'), ox = orb.getContext('2d');
const STARS = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random()*1.1 + .2, a: Math.random()*.5 + .15 }));
function fit(){ const r = cor.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); cor.width = Math.round(r.width*dpr); cor.height = Math.round(r.height*dpr); }
addEventListener('resize', fit);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let COL = {};
function cols(){ COL = { earth: css('--earth'), dust: css('--dust'), gold: css('--gold'), ink: css('--ink'), dim: css('--dim'), faint: css('--faint'), rule: css('--rule') }; }
const rgb = h => { const n = parseInt(h.slice(1), 16); return `${n>>16},${(n>>8)&255},${n&255}`; };

let crossShown = new WeakSet(), crossLabel = null, titleFlight = null;
function frame(){
  const W = cor.width, H = cor.height, dpr = W/Math.max(1, cor.clientWidth);
  cx.clearRect(0, 0, W, H);
  for (const s of STARS){ cx.globalAlpha = s.a*(1 - S.sun*.6); cx.fillStyle = '#cfd6ea'; cx.beginPath(); cx.arc(s.x*W, s.y*H, s.r*dpr, 0, 7); cx.fill(); }
  cx.globalAlpha = 1;
  const pad = Math.max(46*dpr, W*.07), xE = pad, xM = W - pad, y = H*.56, span = xM - xE;
  const now = vnow();

  // light-minute ticks
  const n = Math.floor(S.delay), step = span/S.delay;
  cx.strokeStyle = COL.rule; cx.lineWidth = 1*dpr;
  cx.beginPath(); cx.moveTo(xE, y); cx.lineTo(xM, y); cx.stroke();
  cx.fillStyle = COL.faint; cx.font = `${10*dpr}px "IBM Plex Mono", monospace`; cx.textAlign = 'center';
  for (let i = 1; i <= n; i++){ const tx = xE + i*step, big = i%5 === 0; cx.strokeStyle = big ? COL.faint : COL.rule; cx.beginPath(); cx.moveTo(tx, y - (big ? 7 : 4)*dpr); cx.lineTo(tx, y + (big ? 7 : 4)*dpr); cx.stroke(); if (big && step*5 > 40*dpr) cx.fillText(i, tx, y + 20*dpr); }
  if (n >= 1 && step > 26*dpr){ cx.textAlign = 'left'; cx.fillText('1 light-minute', xE + step + 6*dpr, y - 10*dpr); }
  cx.textAlign = 'center'; cx.fillStyle = COL.dim; cx.font = `${10.5*dpr}px "IBM Plex Mono", monospace`;
  cx.fillText(`${kmM(S.delay)} MILLION KM · ${fmtMin(S.delay).toUpperCase()} AT THE SPEED OF LIGHT`, W/2, H*.17);

  // the Sun, during conjunction
  if (S.sun > .01){
    const sx = W/2, R = Math.max(W, H)*.55*S.sun;
    const sg = cx.createRadialGradient(sx, y, 0, sx, y, R);
    sg.addColorStop(0, `rgba(255,236,200,${.95*S.sun})`); sg.addColorStop(.12, `rgba(246,214,160,${.6*S.sun})`); sg.addColorStop(.45, `rgba(220,156,96,${.18*S.sun})`); sg.addColorStop(1, 'rgba(220,156,96,0)');
    cx.fillStyle = sg; cx.fillRect(0, 0, W, H);
  }

  // planets
  body(xE, y, 6*dpr, COL.earth, 'EARTH · YOU', dpr, 'left');
  body(xM, y, 5*dpr, COL.dust, 'MARS · AVA', dpr, 'right');

  // title attract: one light crossing, forever
  if (S.mode === 'title' && (!titleFlight || now > titleFlight.t0 + titleFlight.dur + 1.5)){ titleFlight = { from: Math.random() < .5 ? 'earth' : 'mars', t0: now, dur: S.delay, kind: 'msg' }; }

  // flights
  const list = S.mode === 'title' && titleFlight ? [titleFlight] : S.flights;
  const posOf = f => { const p = f.held ? 0 : (now - f.t0)/f.dur; return p; };
  for (let i = list.length - 1; i >= 0; i--){
    const f = list[i], col = f.kind === 'song' ? COL.gold : f.from === 'earth' ? COL.earth : COL.dust, c = rgb(col);
    const dir = f.from === 'earth' ? 1 : -1, x0 = f.from === 'earth' ? xE : xM;
    if (f.held){
      const hx = xE + 14*dpr + (f.slot%6)*7*dpr, hy = y - 16*dpr - Math.floor(f.slot/6)*7*dpr;
      const pulse = .55 + .45*Math.sin(now*2 + f.slot);
      cx.fillStyle = `rgba(${c},${pulse})`; cx.beginPath(); cx.arc(hx, hy, 2.4*dpr, 0, 7); cx.fill();
      if (f.label) f.label.textContent = 'waiting on Earth until the Sun moves';
      continue;
    }
    const p = posOf(f);
    if (f.label){ const left = (1 - p)*f.dur; if (p < 1) f.label.textContent = p < 0 ? 'queued' : `reaches Mars in ${fmtLeft(left)}`; }
    if (f.len){
      const pt = (now - f.t0 - f.len)/f.dur, a = Math.max(0, Math.min(1, p)), b = Math.max(0, Math.min(1, pt));
      if (p >= 1 && !f.head){ f.head = true; f.onHead && f.onHead(); }
      if (a > 0){
        cx.strokeStyle = `rgba(${c},.85)`; cx.lineWidth = 3*dpr; cx.lineCap = 'round';
        cx.beginPath(); cx.moveTo(x0 + dir*span*b, y); cx.lineTo(x0 + dir*span*a, y); cx.stroke();
        const hg = cx.createRadialGradient(x0 + dir*span*a, y, 0, x0 + dir*span*a, y, 16*dpr); hg.addColorStop(0, `rgba(${c},.8)`); hg.addColorStop(1, `rgba(${c},0)`);
        cx.fillStyle = hg; cx.beginPath(); cx.arc(x0 + dir*span*a, y, 16*dpr, 0, 7); cx.fill();
      }
      if (pt >= 1){ if (list === S.flights) list.splice(i, 1); f.arrive && f.arrive(); }
      continue;
    }
    if (p < 0) continue;
    if (p >= 1){ if (list === S.flights) list.splice(i, 1); f.arrive && f.arrive(); continue; }
    const px = x0 + dir*span*p;
    for (let k = 1; k <= 12; k++){ const q = Math.max(0, p - k*.012); cx.globalAlpha = (1 - k/13)*.45; cx.fillStyle = `rgba(${c},1)`; cx.beginPath(); cx.arc(x0 + dir*span*q, y, 2.6*dpr*(1 - k/15), 0, 7); cx.fill(); }
    cx.globalAlpha = 1;
    const gl = cx.createRadialGradient(px, y, 0, px, y, 13*dpr); gl.addColorStop(0, `rgba(${c},.95)`); gl.addColorStop(1, `rgba(${c},0)`);
    cx.fillStyle = gl; cx.beginPath(); cx.arc(px, y, 13*dpr, 0, 7); cx.fill();
    cx.fillStyle = `rgba(${c},1)`; cx.beginPath(); cx.arc(px, y, 2.4*dpr, 0, 7); cx.fill();
  }

  // two letters passing each other in the dark
  if (S.mode === 'story'){
    const E = S.flights.filter(f => f.from === 'earth' && !f.held && !f.len), M = S.flights.filter(f => f.from === 'mars');
    for (const e of E) for (const m of M){
      const pe = posOf(e), pm = posOf(m);
      if (pe > 0 && pm > 0 && pe < 1 && pm < 1 && pe >= 1 - pm && !crossShown.has(e)){ crossShown.add(e); crossLabel = { x: xE + span*pe, t: now }; }
    }
  }
  if (crossLabel && now - crossLabel.t < 3.2){
    const a = 1 - (now - crossLabel.t)/3.2;
    cx.globalAlpha = Math.max(0, a); cx.fillStyle = COL.ink; cx.textAlign = 'center'; cx.font = `italic ${13*dpr}px Newsreader, Georgia, serif`;
    cx.fillText('your letters passed each other', crossLabel.x, y - 22*dpr); cx.globalAlpha = 1;
  }

  // status line
  if (S.mode === 'story'){
    const parts = [];
    const left = f => { const p = posOf(f); return p >= 0 && p <= 1 ? (1 - p)*f.dur : -1; };
    const ea = S.flights.filter(f => f.from === 'earth' && !f.held && !f.len).map(left).filter(v => v >= 0);
    const ma = S.flights.filter(f => f.from === 'mars').map(left).filter(v => v >= 0);
    const hl = S.flights.filter(f => f.held).length;
    if (ea.length) parts.push(`<span class="e">Your letter${ea.length > 1 ? 's' : ''} reach${ea.length > 1 ? '' : 'es'} Mars in ${fmtLeft(Math.min(...ea))}</span>`);
    if (ma.length) parts.push(`<span class="m">${ma.length > 1 ? ma.length + ' letters from Ava are' : 'A letter from Ava is'} in the gap · ${fmtLeft(Math.min(...ma))} out</span>`);
    if (hl) parts.push(`<span class="e">${hl} waiting on Earth</span>`);
    status.innerHTML = parts.join(' · ') || '&nbsp;';
  } else status.innerHTML = '&nbsp;';

  drawOrbit();
  requestAnimationFrame(frame);
}
function body(x, y, r, col, label, dpr, side){
  const c = rgb(col), g = cx.createRadialGradient(x, y, 0, x, y, r*4); g.addColorStop(0, `rgba(${c},.55)`); g.addColorStop(1, `rgba(${c},0)`);
  cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r*4, 0, 7); cx.fill();
  cx.fillStyle = col; cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fill();
  cx.font = `500 ${10*dpr}px "IBM Plex Mono", monospace`; cx.fillStyle = col; cx.textAlign = side === 'left' ? 'left' : 'right';
  cx.fillText(label, side === 'left' ? x - r : x + r, y + 30*dpr);
}
function drawOrbit(){
  if (!orb.offsetParent || !S.sky) return;
  const W = orb.width, H = orb.height, c = W/2, k = W/2/1.75;
  ox.clearRect(0, 0, W, H);
  ox.strokeStyle = COL.rule; ox.lineWidth = 2;
  for (const a of [1, 1.524]){ ox.beginPath(); ox.arc(c, c, a*k, 0, 7); ox.stroke(); }
  const sg = ox.createRadialGradient(c, c, 0, c, c, 30); sg.addColorStop(0, 'rgba(255,230,180,1)'); sg.addColorStop(1, 'rgba(255,200,120,0)');
  ox.fillStyle = sg; ox.beginPath(); ox.arc(c, c, 30, 0, 7); ox.fill();
  const E = S.sky.e, M = S.sky.m, ex = c + E[0]*k, ey = c - E[1]*k, mx = c + M[0]*k, my = c - M[1]*k;
  ox.setLineDash([4, 6]); ox.strokeStyle = S.link === 'down' ? COL.dust : COL.faint; ox.beginPath(); ox.moveTo(ex, ey); ox.lineTo(mx, my); ox.stroke(); ox.setLineDash([]);
  ox.fillStyle = COL.earth; ox.beginPath(); ox.arc(ex, ey, 7, 0, 7); ox.fill();
  ox.fillStyle = COL.dust; ox.beginPath(); ox.arc(mx, my, 6, 0, 7); ox.fill();
  ox.font = '500 18px "IBM Plex Mono", monospace'; ox.fillStyle = COL.earth; ox.textAlign = 'center'; ox.fillText('EARTH', ex, ey - 16);
  ox.fillStyle = COL.dust; ox.fillText('MARS', mx, my - 14);
}

/* ---------- boot ---------- */
cols(); fit(); setDate(D(2035,9,13)); toTitle(); requestAnimationFrame(frame);
document.fonts && document.fonts.ready.then(() => { fit(); });
</script>
